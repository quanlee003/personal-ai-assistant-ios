[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-iphone-assistant"
version = "0.1.0"
description = "Vietnamese voice-controlled iPhone assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.5,<0.6",
    "python-dotenv>=1.0,<2",
    "openai>=1.0,<3",
    "pydantic>=2.0,<3",
]

[project.scripts]
iphone-assistant = "iphone_assistant.direct_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
