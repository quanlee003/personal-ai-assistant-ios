[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-iphone-assistant"
version = "0.1.0"
description = "Vietnamese voice-controlled iPhone assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
iphone-assistant = "iphone_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]