[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-iphone-assistant"
version = "0.1.0"
description = "Vietnamese voice-controlled iPhone assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = [
    "pyttsx3>=2.90,<3",
]

speech = [
    "sounddevice>=0.5,<0.6",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
iphone-assistant = "iphone_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]